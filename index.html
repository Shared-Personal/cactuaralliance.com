      rel="stylesheet"
    />
    <script>
      // Restore path encoded by 404.html redirect for SPA deep-link support on GitHub Pages
      (function () {
        var q = window.location.search;
        if (q && q.startsWith('?/')) {
          var path = q.slice(1).split('&').slice(0, -1).join('&');
          window.history.replaceState(null, null, path + window.location.hash);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
